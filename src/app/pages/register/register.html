<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join BookQuotes today</p>

    <form #form="ngForm" (ngSubmit)="submit()" class="auth-form">
      <div class="input-group">
        <input type="text" [(ngModel)]="model.userName" name="userName" required minlength="3">
        <label>Username</label>
      </div>

      <div class="input-group">
        <input type="password" [(ngModel)]="model.password" name="password" required minlength="6">
        <label>Password</label>
      </div>

      <button type="submit" class="auth-btn" [disabled]="form.invalid">Register</button>
    </form>

  </div>
</div>
